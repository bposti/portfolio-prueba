<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <p class="eyebrow">PORTFOLIO</p>
    <h1 id="nombre"></h1>
    <p id="titular"></p>
    <div class="acciones">
      <a id="github" href="#" target="_blank" rel="noopener" class="btn btn--primario">GitHub</a>
      <a id="linkedin" href="#" target="_blank" rel="noopener" class="btn btn--secundario">LinkedIn</a>
      <a id="correo" href="#" class="btn btn--secundario">Correo</a>
    </div>
  </header>

  <main>
    <section id="sobre-mi" aria-labelledby="sobre-mi-titulo">
      <h2 id="sobre-mi-titulo">Sobre mí</h2>
      <p id="sobre-mi-texto"></p>
    </section>

    <section id="proyectos" aria-labelledby="proyectos-titulo">
      <h2 id="proyectos-titulo">Proyectos</h2>
      <nav id="filtros" aria-label="Filtrar proyectos por tecnología"></nav>
      <p id="contador" aria-live="polite"></p>
      <div id="lista-proyectos"></div>
      <p id="sin-resultados" class="estado-vacio" hidden>No hay proyectos con esta tecnología</p>
      <p id="error-proyectos" class="estado-vacio" hidden>No se han podido cargar los proyectos</p>
    </section>
  </main>

  <footer>
    <p>
      <a id="footer-github" href="#" target="_blank" rel="noopener">GitHub</a> ·
      <a id="footer-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a> ·
      <a id="footer-correo" href="#">Correo</a>
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
